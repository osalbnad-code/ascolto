<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16233a">
<title>Ascolto</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ec; --surface:#ffffff; --ink:#16233a; --muted:#5d6878;
  --line:#d5dbd3; --accent:#c9761f; --accent-soft:#f3e3cf; --ring-track:#dde3db;
  --danger:#b2402e; --scrim:rgba(10,16,28,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101a2b; --surface:#17243a; --ink:#e9ece6; --muted:#97a2b3;
    --line:#26354f; --accent:#eda54f; --accent-soft:#33301f; --ring-track:#223250;
    --danger:#e07a63; --scrim:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#101a2b; --surface:#17243a; --ink:#e9ece6; --muted:#97a2b3;
  --line:#26354f; --accent:#eda54f; --accent-soft:#33301f; --ring-track:#223250;
  --danger:#e07a63; --scrim:rgba(0,0,0,.55);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:18px 18px 40px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;font-weight:700;
  font-size:2rem;letter-spacing:-.02em;margin:4px 0 0}
.count{color:var(--muted);font-size:.9rem}

/* Lettore */
.player{margin-top:18px;display:grid;justify-items:center;gap:14px}
.dial{position:relative;width:min(72vw,280px);aspect-ratio:1}
.dial svg{width:100%;height:100%;transform:rotate(-90deg);touch-action:none;cursor:pointer}
.dial circle{fill:none;stroke-width:14}
.track-ring{stroke:var(--ring-track)}
.prog-ring{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.dial-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;padding:0 18%}
.time{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:2.4rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.dur{color:var(--muted);font-size:.9rem;margin-top:6px;font-variant-numeric:tabular-nums}
.now{text-align:center;max-width:100%}
.now-title{font-weight:600;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.now-sub{color:var(--muted);font-size:.88rem;min-height:1.2em}

.controls{display:flex;align-items:center;justify-content:center;gap:clamp(2px,2vw,14px);width:100%;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,label:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
.icon-btn{width:clamp(40px,12vw,52px);height:clamp(40px,12vw,52px);border-radius:50%;display:grid;place-items:center;flex:none}
.icon-btn svg{width:26px;height:26px;fill:currentColor}
.icon-btn:active{background:var(--accent-soft)}
.play{width:clamp(60px,18vw,76px);height:clamp(60px,18vw,76px);background:var(--ink);color:var(--bg)}
.play svg{width:34px;height:34px}
.play:active{background:var(--accent);color:#fff}

.options{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.88rem;font-weight:500;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
select.chip{appearance:none;-webkit-appearance:none}
.timer-info{color:var(--accent);font-size:.88rem;font-weight:600;min-height:1.2em;text-align:center;font-variant-numeric:tabular-nums}

/* Playlist */
.lib-head{display:flex;align-items:center;justify-content:space-between;margin:28px 0 10px;gap:10px}
h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.25rem;margin:0;font-weight:700}
.add{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;flex:none}
.add input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .chip{flex:none}
.tabs .new{border-style:dashed}
.list-tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.list-tools .chip{color:var(--ink)}
.list-tools .chip.play-all{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list-tools .chip.danger{color:var(--danger)}

ol.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:4px 0}
.list .pick{flex:1;min-width:0;text-align:left;padding:10px 4px;display:flex;gap:12px;align-items:center}
.list .idx{width:1.8em;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem;text-align:right;flex:none}
.list .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li.current .name{color:var(--accent);font-weight:600}
.list li.current .idx{color:var(--accent)}
.more{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.more svg{width:20px;height:20px;fill:currentColor}
.more:active{background:var(--accent-soft)}
.empty{color:var(--muted);padding:22px 4px;text-align:center;display:block!important}
.foot{margin-top:22px;display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.85rem}
.link{text-decoration:underline;color:var(--muted);padding:4px 0}

/* Pannello del brano */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet-bg[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow-y:auto}
.sheet-title{font-weight:600;font-size:1.05rem;margin-bottom:12px;word-break:break-word}
.sheet-label{color:var(--muted);font-size:.85rem;margin:10px 0 4px}
.check{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.sheet-actions{display:grid;gap:8px;margin-top:14px}
.sheet-actions button{padding:12px;border-radius:12px;border:1px solid var(--line);text-align:center;font-weight:500}
.sheet-actions .danger{color:var(--danger)}
.sheet-actions .close{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Ricerca */
.search{display:block;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;margin:0 0 10px}
.search::placeholder{color:var(--muted)}
.search[hidden]{display:none}

/* Equalizzatore e sveglia */
.eq-row{display:grid;grid-template-columns:4.4em 1fr 3.6em;align-items:center;gap:10px;padding:6px 0}
.eq-row input[type=range]{width:100%;accent-color:var(--accent)}
.eq-row .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 6px}
.field{display:grid;gap:6px;margin:10px 0}
.field span{color:var(--muted);font-size:.85rem}
.field input,.field select{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.note{color:var(--muted);font-size:.85rem;margin:10px 0 0}
.alarm-info{color:var(--accent);font-size:.88rem;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.alarm-info[hidden]{display:none}

/* Modalità notte e sveglia che suona: sempre scura */
.night{position:fixed;inset:0;background:#05080f;color:#c9cfd8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:40;text-align:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.night[hidden]{display:none}
.night .clock{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;font-size:clamp(4rem,22vw,9rem);font-weight:500;font-variant-numeric:tabular-nums;color:#7d889b;line-height:1}
.night .info{color:#6b7587;max-width:32ch}
.night.ringing .clock{color:#eda54f}
.night.ringing .info{color:#e9ece6;font-weight:600}
.night .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.night button{border:1px solid #2a3344;border-radius:999px;padding:13px 22px;color:#c9cfd8;font-weight:500}
.night button.primary{background:#eda54f;color:#16233a;border-color:#eda54f;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:30}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.prog-ring{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ascolto</h1>
    <span class="count" id="count"></span>
  </header>

  <section class="player" aria-label="Lettore">
    <div class="dial">
      <svg viewBox="0 0 200 200" id="dial" role="slider" aria-label="Posizione nel brano" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <circle class="track-ring" cx="100" cy="100" r="88"/>
        <circle class="prog-ring" id="prog" cx="100" cy="100" r="88"/>
      </svg>
      <div class="dial-center">
        <div class="time" id="cur">0:00</div>
        <div class="dur" id="dur">nessun brano</div>
      </div>
    </div>

    <div class="now">
      <div class="now-title" id="title">Aggiungi i tuoi MP3 per iniziare</div>
      <div class="now-sub" id="sub"></div>
    </div>

    <div class="controls">
      <button class="icon-btn" id="back10" aria-label="Indietro 10 secondi"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.5" font-size="6.5" text-anchor="middle" font-family="sans-serif" font-weight="700">10</text></svg></button>
      <button class="icon-btn" id="prev" aria-label="Brano precedente"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="icon-btn play" id="play" aria-label="Riproduci"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="icon-btn" id="next" aria-label="Brano successivo"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <button class="icon-btn" id="fwd30" aria-label="Avanti 30 secondi"><svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.5" font-size="6.5" text-anchor="middle" font-family="sans-serif" font-weight="700">30</text></svg></button>
    </div>

    <div class="options">
      <button class="chip" id="repeat" aria-pressed="false">Ripeti: no</button>
      <button class="chip" id="shuffle" aria-pressed="false">Casuale</button>
      <button class="chip" id="speed" aria-pressed="false">Velocità 1×</button>
      <select class="chip" id="sleep" aria-label="Timer di spegnimento">
        <option value="0">Timer: off</option>
        <option value="15">Spegni tra 15 min</option>
        <option value="30">Spegni tra 30 min</option>
        <option value="45">Spegni tra 45 min</option>
        <option value="60">Spegni tra 60 min</option>
        <option value="90">Spegni tra 90 min</option>
        <option value="120">Spegni tra 2 ore</option>
        <option value="custom">Minuti a scelta…</option>
        <option value="end">A fine brano</option>
      </select>
      <button class="chip" id="fade" aria-pressed="true">Dissolvenza</button>
      <button class="chip" id="eqBtn" aria-pressed="false">Equalizzatore</button>
      <button class="chip" id="alarmBtn" aria-pressed="false">Sveglia</button>
    </div>
    <div class="timer-info" id="timerInfo" aria-live="polite"></div>
    <button class="alarm-info" id="alarmInfo" hidden></button>
  </section>

  <div class="lib-head">
    <h2>I tuoi brani</h2>
    <label class="add" tabindex="0">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
      Aggiungi
      <input type="file" id="file" multiple>
    </label>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Playlist"></div>
  <input type="search" class="search" id="search" placeholder="Cerca un brano…" aria-label="Cerca un brano" autocomplete="off" hidden>
  <div class="list-tools" id="listTools"></div>
  <ol class="list" id="list"></ol>

  <div class="foot">
    <span id="storage"></span>
    <button class="link" id="clear">Svuota libreria</button>
  </div>
</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-title" id="sheetTitle"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<div class="night" id="night" hidden role="dialog" aria-label="Modalità notte">
  <div class="clock" id="nClock">00:00</div>
  <div class="info" id="nInfo"></div>
  <div class="btns" id="nBtns"></div>
</div>

<audio id="audio" preload="metadata"></audio>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const audio = $('audio');
  const R = 88, C = 2 * Math.PI * R;
  const FADE_MS = 30000;              // durata della dissolvenza finale
  $('prog').style.strokeDasharray = C;
  $('prog').style.strokeDashoffset = C;

  // ---------- Stato ----------
  let tracks = [];          // {id, name, size, added}
  let lists = [];           // {id, name, ids: []}
  let activeList = 'all';   // playlist mostrata
  let playCtx = 'all';      // playlist in riproduzione
  let order = [];           // id dei brani nell'ordine di riproduzione
  let curId = null;
  let currentUrl = null;
  let repeatMode = 'no';    // no | tutti | uno
  let shuffle = false;
  let fadeOn = true;
  const speeds = [1, 1.25, 1.5, 0.75];
  let speedIdx = 0;
  let sleepUntil = 0, sleepAtEnd = false, sleepTick = null;
  let query = '';                 // testo della ricerca
  let ringing = false;            // sveglia in corso

  // ---------- Equalizzatore (Web Audio) ----------
  const EQ_BANDS = [60, 250, 1000, 4000, 12000];
  const EQ_LABELS = ['60 Hz', '250 Hz', '1 kHz', '4 kHz', '12 kHz'];
  const PRESETS = {
    Normale: [0, 0, 0, 0, 0],
    Bassi:   [6, 4, 0, -1, -1],
    Voce:    [-3, -1, 3, 4, 1],
    Acuti:   [-1, -1, 0, 3, 6],
    Notte:   [2, 1, 0, -3, -6],
    Cuffie:  [3, 1, -1, 1, 3]
  };
  let actx = null, filters = [], gainNode = null;
  let eqOn = false, eqGains = [0, 0, 0, 0, 0];
  function ensureGraph() {
    if (actx) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      actx = new AC();
      const src = actx.createMediaElementSource(audio);
      filters = EQ_BANDS.map((f, i) => {
        const b = actx.createBiquadFilter();
        b.type = i === 0 ? 'lowshelf' : i === EQ_BANDS.length - 1 ? 'highshelf' : 'peaking';
        b.frequency.value = f; b.Q.value = 1; b.gain.value = 0;
        return b;
      });
      gainNode = actx.createGain();
      let n = src;
      filters.forEach(f => { n.connect(f); n = f; });
      n.connect(gainNode); gainNode.connect(actx.destination);
      audio.volume = 1;
      return true;
    } catch { actx = null; return false; }
  }
  function applyEq() {
    if (!actx) return;
    filters.forEach((f, i) => { f.gain.value = eqOn ? eqGains[i] : 0; });
  }
  function setVolume(v) {
    if (gainNode) { gainNode.gain.value = v; audio.volume = 1; }
    else audio.volume = v;
  }

  // ---------- Preferenze ----------
  const prefs = {
    get(k, d) { try { const v = localStorage.getItem('ascolto:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('ascolto:' + k, JSON.stringify(v)); } catch {} }
  };

  // ---------- IndexedDB ----------
  let db = null;
  function openDB() {
    return new Promise(res => {
      try {
        const req = indexedDB.open('ascolto-db', 2);
        req.onupgradeneeded = () => {
          const d = req.result;
          if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs');
          if (!d.objectStoreNames.contains('lists')) d.createObjectStore('lists', { keyPath: 'id' });
        };
        req.onsuccess = () => res(req.result);
        req.onerror = () => res(null);
      } catch { res(null); }
    });
  }
  function tx(store, mode, fn) {
    return new Promise((res, rej) => {
      if (!db) return res(null);
      try {
        const t = db.transaction(store, mode);
        const out = fn(t.objectStore(store));
        t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
        t.onerror = () => rej(t.error);
        t.onabort = () => rej(t.error);
      } catch (e) { rej(e); }
    });
  }
  const memBlobs = new Map();       // riserva se IndexedDB non è disponibile
  const saveList = l => tx('lists', 'readwrite', s => s.put(l)).catch(() => {});
  const deleteListDB = id => tx('lists', 'readwrite', s => s.delete(id)).catch(() => {});

  // ---------- Utilità ----------
  const fmt = s => {
    if (!isFinite(s) || s < 0) s = 0;
    s = Math.floor(s);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}` : `${m}:${String(x).padStart(2,'0')}`;
  };
  const cleanName = n => n.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').trim();
  const byId = id => tracks.find(t => t.id === id);
  const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const listById = id => lists.find(l => l.id === id);
  const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  let toastT;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400);
  }

  // Brani di una vista: "Tutti" in ordine alfabetico, playlist nell'ordine di inserimento
  function viewIds(ctx) {
    if (ctx === 'all') return tracks.map(t => t.id);
    const l = listById(ctx);
    return l ? l.ids.filter(id => byId(id)) : tracks.map(t => t.id);
  }
  function ctxName(ctx) { return ctx === 'all' ? 'Tutti i brani' : (listById(ctx) || {}).name || 'Tutti i brani'; }

  function buildOrder(keepId) {
    order = viewIds(playCtx);
    if (shuffle) {
      for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
      const k = keepId ? order.indexOf(keepId) : -1;
      if (k > 0) { order.splice(k, 1); order.unshift(keepId); }
    }
  }
  const currentTrack = () => curId ? byId(curId) : null;

  // ---------- Schede playlist ----------
  function renderTabs() {
    const box = $('tabs'); box.innerHTML = '';
    const mk = (id, label, n) => {
      const b = document.createElement('button');
      b.className = 'chip'; b.setAttribute('role', 'tab');
      b.setAttribute('aria-pressed', id === activeList);
      b.setAttribute('aria-selected', id === activeList);
      b.textContent = `${label} · ${n}`;
      b.onclick = () => { activeList = id; prefs.set('active', id); renderTabs(); renderList(); };
      box.appendChild(b);
    };
    mk('all', 'Tutti', tracks.length);
    lists.forEach(l => mk(l.id, l.name, viewIds(l.id).length));
    const nb = document.createElement('button');
    nb.className = 'chip new'; nb.textContent = '+ Nuova playlist';
    nb.onclick = () => newList(null);

  function renderTools() {

  // ---------- Elenco brani ----------
  function renderList() {

    $('storage').textContent = !db ? 'Archivio non disponibile: i brani restano solo finché l’app è aperta'
      : total ? `${(total / 1048576).toFixed(1)} MB salvati` : '';
  }
  const renderAll = () => { renderTabs(); renderList(); updateSub(); };

  // ---------- Pannello opzioni del brano ----------
  function closeSheet() { $('sheetBg').hidden = true; }
  $('sheetBg').addEventListener('click', e => { if (e.target === $('sheetBg')) closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  function openTrackSheet(id) {
    const t = byId(id); if (!t) return;
    $('sheetTitle').textContent = t.name;
    const body = $('sheetBody'); body.innerHTML = '';
    const lab = document.createElement('div');

    lists.forEach(l => {
      const row = document.createElement('label');

      cb.onchange = () => {
        if (cb.checked) { if (!l.ids.includes(id)) l.ids.push(id); }
        else l.ids = l.ids.filter(x => x !== id);
        saveList(l);
        if (playCtx === l.id) buildOrder(curId);
        renderAll();
      };
      const span = document.createElement('span'); span.textContent = l.name;

    });
    const acts = document.createElement('div'); acts.className = 'sheet-actions';

  function openSheet(title, build) {
    $('sheetTitle').textContent = title;
    const body = $('sheetBody'); body.innerHTML = '';
    build(body);
    $('sheetBg').hidden = false;
  }
  const el = (tag, props = {}, text) => { const e = Object.assign(document.createElement(tag), props); if (text !== undefined) e.textContent = text; return e; };

  // ---------- Equalizzatore: pannello ----------
  function openEqSheet() {
    openSheet('Equalizzatore', body => {
      const row = el('label', { className: 'check' });
      const cb = el('input', { type: 'checkbox', checked: eqOn });
      row.append(cb, el('span', {}, 'Equalizzatore attivo'));
      body.appendChild(row);
      const sliders = [];
      const vals = [];
      const refresh = () => {
        sliders.forEach((r, i) => { r.value = eqGains[i]; });
        vals.forEach((v, i) => { v.textContent = (eqGains[i] > 0 ? '+' : '') + eqGains[i] + ' dB'; });
        cb.checked = eqOn;
        $('eqBtn').setAttribute('aria-pressed', eqOn);
      };
      const commit = () => {
        if (eqOn) ensureGraph();
        applyEq(); prefs.set('eqOn', eqOn); prefs.set('eq', eqGains); refresh();
      };
      cb.onchange = () => { eqOn = cb.checked; commit(); };
      body.appendChild(el('div', { className: 'sheet-label' }, 'Preimpostazioni'));
      const pr = el('div', { className: 'presets' });
      Object.entries(PRESETS).forEach(([name, g]) => {
        const b = el('button', { className: 'chip' }, name);
        b.onclick = () => { eqGains = g.slice(); eqOn = name !== 'Normale' || eqOn; commit(); };
        pr.appendChild(b);
      });
      body.appendChild(pr);
      body.appendChild(el('div', { className: 'sheet-label' }, 'Regolazione fine'));
      EQ_LABELS.forEach((lab, i) => {
        const r = el('div', { className: 'eq-row' });
        const range = el('input', { type: 'range', min: -12, max: 12, step: 1, value: eqGains[i] });
        range.setAttribute('aria-label', 'Guadagno ' + lab);
        const v = el('span', { className: 'val' });
        range.oninput = () => { eqGains[i] = +range.value; eqOn = true; commit(); };
        r.append(el('span', {}, lab), range, v);
        sliders.push(range); vals.push(v);
        body.appendChild(r);
      });
      body.appendChild(el('p', { className: 'note' }, 'Le bande basse sono a sinistra (60 Hz), le alte a destra (12 kHz). Se un brano distorce, abbassa le bande alzate di 1–2 dB.'));
      const acts = el('div', { className: 'sheet-actions' });
      const done = el('button', { className: 'close' }, 'Fatto');
      done.onclick = closeSheet;
      acts.appendChild(done);
      body.appendChild(acts);
      refresh();
    });
  }
  $('eqBtn').onclick = openEqSheet;

  // ---------- Sveglia ----------
  let alarm = null;               // {time:'07:00', id, fade, at}
  let alarmTick = null, rampTimer = null, wakeLock = null;
  const pad = n => String(n).padStart(2, '0');
  function nextOccurrence(hhmm) {
    const [h, m] = hhmm.split(':').map(Number);
    const d = new Date(); d.setHours(h, m, 0, 0);
    if (d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);
    return d.getTime();
  }
  function untilText(ms) {
    const min = Math.max(0, Math.round(ms / 60000));
    const h = Math.floor(min / 60), m = min % 60;
    return h ? `${h} h ${m} min` : `${m} min`;
  }
  function updateAlarmInfo() {
    $('alarmBtn').setAttribute('aria-pressed', !!alarm);
    const info = $('alarmInfo');
    if (!alarm) { info.hidden = true; return; }
    const t = byId(alarm.id);
    const hhmm = new Date(alarm.at);
    info.textContent = `Sveglia alle ${pad(hhmm.getHours())}:${pad(hhmm.getMinutes())}${t ? ' · ' + t.name : ''} — modalità notte`;
    info.hidden = false;
  }
  function openAlarmSheet() {
    openSheet('Sveglia', body => {
      if (!tracks.length) {
        body.appendChild(el('p', { className: 'note' }, 'Aggiungi prima almeno un brano da usare come suoneria.'));
        const acts = el('div', { className: 'sheet-actions' });
        const ok = el('button', { className: 'close' }, 'Ok'); ok.onclick = closeSheet;
        acts.appendChild(ok); body.appendChild(acts); return;
      }
      const f1 = el('label', { className: 'field' });
      const time = el('input', { type: 'time', value: alarm ? alarm.time : '07:00', required: true });
      f1.append(el('span', {}, 'Ora'), time);
      const f2 = el('label', { className: 'field' });
      const sel = el('select');
      tracks.forEach(t => sel.appendChild(el('option', { value: t.id, selected: t.id === (alarm ? alarm.id : curId) }, t.name)));
      f2.append(el('span', {}, 'Brano'), sel);
      const fr = el('label', { className: 'check' });
      const fade = el('input', { type: 'checkbox', checked: alarm ? alarm.fade : true });
      fr.append(fade, el('span', {}, 'Volume crescente nel primo minuto'));
      body.append(f1, f2, fr);
      body.appendChild(el('p', { className: 'note' }, 'Suona solo se Ascolto resta aperto: lascia il telefono in carica con la modalità notte attiva, che tiene lo schermo acceso al minimo. Se chiudi l’app o blocchi lo schermo, la sveglia non può suonare. Per una sveglia garantita usa l’Orologio di Android, scegliendo l’MP3 come suoneria.'));
      const acts = el('div', { className: 'sheet-actions' });
      const on = el('button', { className: 'close' }, alarm ? 'Aggiorna e avvia modalità notte' : 'Attiva e avvia modalità notte');
      on.onclick = () => {
        if (!time.value) { toast('Scegli un orario'); return; }
        alarm = { time: time.value, id: sel.value, fade: fade.checked, at: nextOccurrence(time.value) };
        prefs.set('alarm', alarm);
        startAlarmWatch(); closeSheet(); showNight();
        toast('Sveglia tra ' + untilText(alarm.at - Date.now()));
      };
      acts.appendChild(on);
      if (alarm) {
        const off = el('button', { className: 'danger' }, 'Disattiva sveglia');
        off.onclick = () => { clearAlarm(); closeSheet(); toast('Sveglia disattivata'); };
        acts.appendChild(off);
      }
      const cancel = el('button', {}, 'Annulla'); cancel.onclick = closeSheet;
      acts.appendChild(cancel);
      body.appendChild(acts);
    });
  }
  $('alarmBtn').onclick = openAlarmSheet;
  $('alarmInfo').onclick = () => showNight();

  function startAlarmWatch() {
    clearInterval(alarmTick);
    updateAlarmInfo();
    if (!alarm) return;
    alarmTick = setInterval(alarmCheck, 1000);
    alarmCheck();
  }
  function alarmCheck() {
    updateNightClock();
    if (!alarm || ringing) return;
    const late = Date.now() - alarm.at;
    if (late >= 0) {
      if (late < 2 * 3600e3) ring();
      else { clearAlarm(); toast('La sveglia è scaduta mentre l’app era chiusa'); }
    }
  }
  function clearAlarm() {
    alarm = null; prefs.set('alarm', null);
    clearInterval(alarmTick); alarmTick = null;
    updateAlarmInfo();
    if (!ringing) hideNight();
  }
  async function ring() {
    const t = byId(alarm.id) || currentTrack() || tracks[0];
    if (!t) { clearAlarm(); return; }
    ringing = true;
    if (sleepUntil || sleepAtEnd) stopSleep(false);
    curId = t.id; buildOrder(curId);
    await loadCurrent(false);
    clearInterval(rampTimer);
    if (alarm.fade) {
      let v = 0.03; setVolume(v);
      rampTimer = setInterval(() => { v = Math.min(1, v + 0.5 / 60); setVolume(v); if (v >= 1) clearInterval(rampTimer); }, 500);
    } else setVolume(1);
    play();
    try { navigator.vibrate && navigator.vibrate([500, 300, 500, 300, 500]); } catch {}
    showNight();
  }
  function stopRing(snooze) {
    ringing = false;
    clearInterval(rampTimer);
    audio.pause(); setVolume(1);
    if (snooze && alarm) {
      alarm.at = Date.now() + 10 * 60000;
      prefs.set('alarm', alarm);
      startAlarmWatch(); showNight();
      toast('Sveglia posticipata di 10 minuti');
    } else {
      clearAlarm(); hideNight();
      toast('Buongiorno!');
    }
  }

  // Modalità notte: orologio a tutto schermo con lo schermo tenuto acceso
  async function requestWakeLock() {
    try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch {}
  }
  function releaseWakeLock() { try { wakeLock && wakeLock.release(); } catch {} wakeLock = null; }
  function showNight() {
    const n = $('night');
    n.hidden = false;
    n.classList.toggle('ringing', ringing);
    const btns = $('nBtns'); btns.innerHTML = '';
    if (ringing) {
      const sn = el('button', {}, 'Posticipa 10 min'); sn.onclick = () => stopRing(true);
      const st = el('button', { className: 'primary' }, 'Ferma'); st.onclick = () => stopRing(false);
      btns.append(sn, st);
    } else {
      const ex = el('button', {}, 'Esci');
      ex.onclick = () => { hideNight(); toast('Lascia Ascolto aperto in primo piano perché la sveglia suoni'); };
      const off = el('button', {}, 'Disattiva sveglia');
      off.onclick = () => { clearAlarm(); toast('Sveglia disattivata'); };
      btns.append(ex, off);
    }
    requestWakeLock();
    updateNightClock();
  }
  function hideNight() { $('night').hidden = true; releaseWakeLock(); }
  function updateNightClock() {
    if ($('night').hidden) return;
    const d = new Date();
    $('nClock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const t = alarm ? byId(alarm.id) : null;
    if (ringing) $('nInfo').textContent = currentTrack() ? currentTrack().name : 'Sveglia';
    else if (alarm) { const at = new Date(alarm.at); $('nInfo').textContent = `Sveglia alle ${pad(at.getHours())}:${pad(at.getMinutes())} · tra ${untilText(alarm.at - Date.now())}${t ? ' · ' + t.name : ''}`; }
    else $('nInfo').textContent = 'Nessuna sveglia attiva';
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (!$('night').hidden) requestWakeLock();
    if (actx && actx.state === 'suspended' && !audio.paused) actx.resume().catch(() => {});
    alarmCheck();
  });

  $('search').addEventListener('input', e => { query = e.target.value; renderList(); });

  // ---------- Gestione playlist ----------
  function newList(withId) {
    const name = (prompt('Nome della nuova playlist') || '').trim();
    if (!name) return;
    const l = { id: newId('p'), name: name.slice(0, 40), ids: withId ? [withId] : [] };
    lists.push(l); saveList(l);
    activeList = l.id; prefs.set('active', l.id);
    renderAll();
    toast(withId ? `Creata «${l.name}» con il brano` : `Playlist «${l.name}» creata`);
  }
  function renameList(id) {
    const l = listById(id); if (!l) return;
    const name = (prompt('Nuovo nome della playlist', l.name) || '').trim();
    if (!name) return;
    l.name = name.slice(0, 40); saveList(l); renderAll();
    if (playCtx === id) updateSub();
  }
  function deleteList(id) {
    const l = listById(id); if (!l) return;
    if (!confirm(`Eliminare la playlist «${l.name}»? I brani restano nella libreria.`)) return;
    lists = lists.filter(x => x.id !== id); deleteListDB(id);
    if (activeList === id) { activeList = 'all'; prefs.set('active', 'all'); }
    if (playCtx === id) { playCtx = 'all'; prefs.set('ctx', 'all'); buildOrder(curId); updateSub(); }
    renderAll();
    toast('Playlist eliminata');
  }

  // ---------- Aggiunta / rimozione brani ----------
  $('file').addEventListener('change', async e => {
    const all = [...e.target.files];
    e.target.value = '';
    const files = all.filter(f => (f.type && f.type.startsWith('audio/')) || /\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|wma)$/i.test(f.name));
    if (all.length && !files.length) { toast('Nessun file audio tra quelli scelti'); return; }
    if (!files.length) return;
    if (files.length < all.length) toast(`${all.length - files.length} file non audio ignorati`);
    const targetList = activeList !== 'all' ? listById(activeList) : null;
    const added = [];
    for (const f of files) {
      const id = newId('t');
      const meta = { id, name: cleanName(f.name), size: f.size, added: Date.now() };
      try {
        if (db) {
          await tx('blobs', 'readwrite', s => s.put(f, id));
          await tx('meta', 'readwrite', s => s.put(meta));
        } else memBlobs.set(id, f);
      } catch {
        memBlobs.set(id, f);
        toast('Spazio pieno: alcuni brani non resteranno salvati');
      }
      tracks.push(meta); added.push(id);
    }
    tracks.sort((a, b) => a.name.localeCompare(b.name, 'it', { numeric: true }));
    if (targetList) { targetList.ids.push(...added); saveList(targetList); }
    if (!currentTrack()) {
      playCtx = activeList; prefs.set('ctx', playCtx);
      buildOrder(null); curId = order[0] || null; loadCurrent(false);
    } else buildOrder(curId);
    renderAll();
    const what = added.length === 1 ? 'Brano aggiunto' : `${added.length} brani aggiunti`;
    toast(targetList ? `${what} a «${targetList.name}»` : what);
  });

  async function removeTrack(id) {
    const wasCurrent = curId === id;
    const wasPlaying = !audio.paused;
    const i = order.indexOf(id);
    try { if (db) { await tx('blobs', 'readwrite', s => s.delete(id)); await tx('meta', 'readwrite', s => s.delete(id)); } } catch {}
    memBlobs.delete(id);
    tracks = tracks.filter(t => t.id !== id);
    lists.forEach(l => { if (l.ids.includes(id)) { l.ids = l.ids.filter(x => x !== id); saveList(l); } });
    if (wasCurrent) {
      audio.pause(); audio.removeAttribute('src');
      order = order.filter(x => x !== id);
      if (!order.length) { playCtx = 'all'; buildOrder(null); }
      curId = order.length ? order[Math.min(Math.max(i, 0), order.length - 1)] : null;
      if (curId) loadCurrent(wasPlaying); else resetUI();
    } else order = order.filter(x => x !== id);
    renderAll();
    toast('Brano rimosso');
  }

  $('clear').onclick = async () => {
    if (!tracks.length && !lists.length) return;
    if (!confirm('Rimuovere tutti i brani e tutte le playlist?')) return;
    audio.pause(); audio.removeAttribute('src');
    try {
      if (db) {
        await tx('blobs', 'readwrite', s => s.clear());
        await tx('meta', 'readwrite', s => s.clear());
        await tx('lists', 'readwrite', s => s.clear());
      }
    } catch {}
    memBlobs.clear(); tracks = []; lists = []; order = []; curId = null;
    if (alarm) clearAlarm();
    activeList = 'all'; playCtx = 'all';
    prefs.set('active', 'all'); prefs.set('ctx', 'all'); prefs.set('resume', null);
    resetUI(); renderAll();
    toast('Libreria svuotata');
  };

  function resetUI() {
    $('title').textContent = 'Aggiungi i tuoi MP3 per iniziare';
    $('sub').textContent = ''; $('cur').textContent = '0:00'; $('dur').textContent = 'nessun brano';
    setRing(0); setPlayIcon(false);
    if ('mediaSession' in navigator) navigator.mediaSession.metadata = null;
  }

  // ---------- Riproduzione ----------
  function updateSub(extra = '') {
    const i = order.indexOf(curId);
    $('sub').textContent = curId ? `${ctxName(playCtx)} · ${i + 1} di ${order.length}${extra}` : '';
  }

  async function loadCurrent(autoplay, startAt = 0) {
    const t = currentTrack(); if (!t) return resetUI();
    let blob = memBlobs.get(t.id);
    if (!blob) { try { blob = await tx('blobs', 'readonly', s => s.get(t.id)); } catch {} }
    if (!blob) { toast('File non trovato, lo rimuovo'); return removeTrack(t.id); }
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = URL.createObjectURL(blob);
    audio.src = currentUrl;
    audio.playbackRate = speeds[speedIdx];
    if (!sleepUntil && !ringing) setVolume(1);
    $('title').textContent = t.name;
    updateSub();
    renderList();
    setMediaMeta(t);
    prefs.set('resume', { id: t.id, time: startAt });
    if (startAt > 0) {
      audio.addEventListener('loadedmetadata', () => { try { audio.currentTime = Math.min(startAt, Math.max(0, audio.duration - 1)); } catch {} }, { once: true });
    }
    if (autoplay) play();
  }

  function play() {
    if (!currentTrack()) { toast('Aggiungi prima un brano'); return Promise.resolve(); }
    if (eqOn && ensureGraph()) applyEq();
    if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
    return audio.play().catch(() => toast('Tocca di nuovo play per avviare'));
  }
  function togglePlay() { audio.paused ? play() : audio.pause(); }

  function next(fromEnd = false) {
    if (!order.length) return;
    let i = order.indexOf(curId);
    if (i < order.length - 1) i++;
    else if (repeatMode === 'tutti' || !fromEnd) {
      if (shuffle && fromEnd) buildOrder(null);
      i = 0;
    } else { audio.pause(); audio.currentTime = 0; return; }
    curId = order[i]; loadCurrent(true);
  }
  function prev() {
    if (!order.length) return;
    if (audio.currentTime > 4) { audio.currentTime = 0; return; }
    let i = order.indexOf(curId);
    i = i > 0 ? i - 1 : order.length - 1;
    curId = order[i]; loadCurrent(true);
  }
  const seekBy = d => { if (isFinite(audio.duration)) audio.currentTime = Math.min(Math.max(0, audio.currentTime + d), audio.duration); };

  audio.addEventListener('ended', () => {
    if (ringing) { audio.currentTime = 0; play(); return; }
    if (sleepAtEnd) { stopSleep(true); toast('Timer: riproduzione fermata'); return; }
    if (repeatMode === 'uno') { audio.currentTime = 0; play(); return; }
    next(true);
  });

  // ---------- Avanzamento ----------
  function setRing(frac) { $('prog').style.strokeDashoffset = C * (1 - Math.min(Math.max(frac, 0), 1)); }
  function setPlayIcon(playing) {
    $('playIcon').innerHTML = playing ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    $('play').setAttribute('aria-label', playing ? 'Pausa' : 'Riproduci');
  }
  let lastSave = 0;
  audio.addEventListener('timeupdate', () => {
    const d = audio.duration, c = audio.currentTime;
    $('cur').textContent = fmt(c);
    $('dur').textContent = isFinite(d) ? 'di ' + fmt(d) : '';
    setRing(isFinite(d) && d > 0 ? c / d : 0);
    $('dial').setAttribute('aria-valuenow', isFinite(d) && d ? Math.round(c / d * 100) : 0);
    const now = Date.now();
    if (now - lastSave > 3000) {
      lastSave = now;
      if (curId) prefs.set('resume', { id: curId, time: c });
      updatePositionState();
    }
    timerCheck();
  });
  audio.addEventListener('play', () => { setPlayIcon(true); updateSub(); if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing'; });
  audio.addEventListener('pause', () => {
    setPlayIcon(false);
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
    if (curId) prefs.set('resume', { id: curId, time: audio.currentTime });
  });
  audio.addEventListener('error', () => { if (audio.src) toast('Formato non supportato da questo telefono'); });

  // Trascinamento sul cerchio
  const dial = $('dial');
  function seekFromPoint(x, y) {
    if (!isFinite(audio.duration)) return;
    const r = dial.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let a = Math.atan2(y - cy, x - cx) + Math.PI / 2;
    if (a < 0) a += 2 * Math.PI;
    audio.currentTime = (a / (2 * Math.PI)) * audio.duration;
  }
  let dragging = false;
  dial.addEventListener('pointerdown', e => { dragging = true; dial.setPointerCapture(e.pointerId); seekFromPoint(e.clientX, e.clientY); });
  dial.addEventListener('pointermove', e => { if (dragging) seekFromPoint(e.clientX, e.clientY); });
  dial.addEventListener('pointerup', () => dragging = false);
  dial.addEventListener('pointercancel', () => dragging = false);
  dial.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { seekBy(5); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { seekBy(-5); e.preventDefault(); }
  });

  // ---------- Pulsanti ----------
  $('play').onclick = togglePlay;
  $('next').onclick = () => next(false);
  $('prev').onclick = prev;
  $('back10').onclick = () => seekBy(-10);
  $('fwd30').onclick = () => seekBy(30);

  function applyRepeat() {
    const label = { no: 'no', tutti: 'tutti', uno: 'questo brano' }[repeatMode];
    $('repeat').textContent = 'Ripeti: ' + label;
    $('repeat').setAttribute('aria-pressed', repeatMode !== 'no');
  }
  $('repeat').onclick = () => {
    repeatMode = repeatMode === 'no' ? 'tutti' : repeatMode === 'tutti' ? 'uno' : 'no';
    applyRepeat(); prefs.set('repeat', repeatMode);
  };
  $('shuffle').onclick = () => {
    shuffle = !shuffle;
    $('shuffle').setAttribute('aria-pressed', shuffle);
    buildOrder(curId); updateSub();
    prefs.set('shuffle', shuffle);
    toast(shuffle ? 'Riproduzione casuale attiva' : 'Ordine normale');
  };
  function applySpeed() {
    audio.playbackRate = speeds[speedIdx];
    $('speed').textContent = 'Velocità ' + String(speeds[speedIdx]).replace('.', ',') + '×';
    $('speed').setAttribute('aria-pressed', speeds[speedIdx] !== 1);
  }
  $('speed').onclick = () => { speedIdx = (speedIdx + 1) % speeds.length; applySpeed(); prefs.set('speed', speedIdx); };
  $('fade').onclick = () => {
    fadeOn = !fadeOn;
    $('fade').setAttribute('aria-pressed', fadeOn);
    prefs.set('fade', fadeOn);
    if (!fadeOn) setVolume(1);
    toast(fadeOn ? 'Dissolvenza negli ultimi 30 secondi del timer' : 'Dissolvenza disattivata');
  };

  // ---------- Timer di spegnimento ----------
  let lastSleepValue = '0';
  function stopSleep(pause) {
    clearInterval(sleepTick); sleepTick = null;
    sleepUntil = 0; sleepAtEnd = false;
    $('sleep').value = '0'; lastSleepValue = '0';
    $('timerInfo').textContent = '';
    if (pause && !audio.paused) audio.pause();
    setVolume(1);
  }
  function startSleep(minutes) {
    clearInterval(sleepTick);
    sleepAtEnd = false;
    sleepUntil = Date.now() + minutes * 60000;
    sleepTick = setInterval(timerCheck, 1000);
    timerCheck();
    toast(`Si ferma tra ${minutes} ${minutes === 1 ? 'minuto' : 'minuti'}`);
  }
  function timerCheck() {
    if (sleepUntil) {
      const rem = sleepUntil - Date.now();
      if (rem <= 0) { stopSleep(true); toast('Timer: riproduzione fermata'); return; }
      $('timerInfo').textContent = 'Spegnimento tra ' + fmt(rem / 1000);
      if (fadeOn && rem <= FADE_MS) setVolume(Math.max(0.03, rem / FADE_MS));
    } else if (sleepAtEnd) {
      const d = audio.duration, left = d - audio.currentTime;
      $('timerInfo').textContent = isFinite(d) ? 'Si ferma a fine brano · ' + fmt(left) : 'Si ferma a fine brano';
      if (fadeOn && isFinite(d) && left * 1000 <= FADE_MS) setVolume(Math.max(0.03, (left * 1000) / FADE_MS));
    }
  }
  $('sleep').addEventListener('change', e => {
    const v = e.target.value;
    if (v === '0') { stopSleep(false); toast('Timer disattivato'); return; }
    if (v === 'end') {
      clearInterval(sleepTick); sleepUntil = 0; sleepAtEnd = true;
      sleepTick = setInterval(timerCheck, 1000);
      setVolume(1); lastSleepValue = v; timerCheck();
      toast('Si ferma a fine brano'); return;
    }
    let minutes = +v;
    if (v === 'custom') {
      const ans = prompt('Dopo quanti minuti fermare la riproduzione?', '20');
      minutes = parseInt(ans, 10);
      if (!(minutes > 0 && minutes <= 720)) { e.target.value = lastSleepValue; if (ans !== null) toast('Inserisci un numero tra 1 e 720'); return; }
    }
    setVolume(1);
    lastSleepValue = v;
    startSleep(minutes);
  });

  // ---------- Media Session (tendina e schermata di blocco) ----------
  const artworkData = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#16233a"/><circle cx="256" cy="256" r="170" fill="none" stroke="#2c3c5c" stroke-width="36"/><path d="M256 86a170 170 0 0 1 147 255" fill="none" stroke="#eda54f" stroke-width="36" stroke-linecap="round"/><path d="M220 196v120l100-60z" fill="#e9ece6"/></svg>');
  function setMediaMeta(t) {
    if (!('mediaSession' in navigator)) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.name, artist: 'Ascolto', album: ctxName(playCtx),
        artwork: [{ src: artworkData, sizes: '512x512', type: 'image/svg+xml' }]
      });
    } catch {}
  }
  function updatePositionState() {
    if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
    const d = audio.duration;
    if (!isFinite(d) || d <= 0) return;
    try { navigator.mediaSession.setPositionState({ duration: d, playbackRate: audio.playbackRate, position: Math.min(audio.currentTime, d) }); } catch {}
  }
  if ('mediaSession' in navigator) {
    const ms = navigator.mediaSession;
    const h = (a, f) => { try { ms.setActionHandler(a, f); } catch {} };
    h('play', play);
    h('pause', () => audio.pause());
    h('previoustrack', prev);
    h('nexttrack', () => next(false));
    h('seekbackward', d => seekBy(-(d && d.seekOffset || 10)));
    h('seekforward', d => seekBy(d && d.seekOffset || 30));
    h('seekto', d => { if (d && isFinite(d.seekTime)) { audio.currentTime = d.seekTime; updatePositionState(); } });
    h('stop', () => { audio.pause(); audio.currentTime = 0; });
  }
  audio.addEventListener('loadedmetadata', updatePositionState);
  audio.addEventListener('ratechange', updatePositionState);
  audio.addEventListener('seeked', updatePositionState);

  // ---------- Avvio ----------
  (async () => {
    db = await openDB();
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch {}
    repeatMode = prefs.get('repeat', 'no'); applyRepeat();
    shuffle = prefs.get('shuffle', false); $('shuffle').setAttribute('aria-pressed', shuffle);
    speedIdx = prefs.get('speed', 0) % speeds.length; applySpeed();
    fadeOn = prefs.get('fade', true); $('fade').setAttribute('aria-pressed', fadeOn);
    eqOn = prefs.get('eqOn', false);
    const g = prefs.get('eq', null); if (Array.isArray(g) && g.length === 5) eqGains = g.map(Number);
    $('eqBtn').setAttribute('aria-pressed', eqOn);
    try { tracks = (await tx('meta', 'readonly', s => s.getAll())) || []; } catch { tracks = []; }
    try { lists = (await tx('lists', 'readonly', s => s.getAll())) || []; } catch { lists = []; }
    tracks.sort((a, b) => a.name.localeCompare(b.name, 'it', { numeric: true }));
    lists.sort((a, b) => a.name.localeCompare(b.name, 'it'));
    activeList = prefs.get('active', 'all'); if (activeList !== 'all' && !listById(activeList)) activeList = 'all';
    playCtx = prefs.get('ctx', 'all'); if (playCtx !== 'all' && !listById(playCtx)) playCtx = 'all';
    const resume = prefs.get('resume', null);
    const ids = viewIds(playCtx);
    curId = resume && ids.includes(resume.id) ? resume.id : (ids[0] || null);
    buildOrder(curId);
    renderAll();
    if (curId) {
      const t0 = resume && resume.id === curId ? resume.time || 0 : 0;
      await loadCurrent(false, t0);
      if (t0 > 5) updateSub(` · riprende da ${fmt(t0)}`);
    }
    alarm = prefs.get('alarm', null);
    if (alarm && !(alarm.at && alarm.time)) alarm = null;
    startAlarmWatch();
  })();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
